<title>DentaLog</title>
<style>
:root{
  --bg1:#eef2fb; --bg2:#e7eefc; --ink:#121826; --muted:#667085; --faint:#98a2b3;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.78); --glass-brd:rgba(255,255,255,.75); --hair:rgba(18,24,38,.08);
  --accent:#4f7cf7; --accent-2:#7aa2ff; --accent-ink:#fff; --teal:#14b8c4;
  --ok:#12a150; --ok-bg:rgba(18,161,80,.12); --bad:#e5484d; --bad-bg:rgba(229,72,77,.12);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.13); --pend:#64748b; --pend-bg:rgba(100,116,139,.12); --info:#2f6fd8; --info-bg:rgba(47,111,216,.11);
  --r:22px; --r-sm:14px;
  --shadow:0 10px 30px rgba(31,45,90,.10), 0 1px 2px rgba(31,45,90,.06);
  --blur:saturate(180%) blur(20px);
}
@media (prefers-color-scheme: dark){
  :root{--bg1:#0b1020;--bg2:#101833;--ink:#eef2ff;--muted:#9aa4bf;--faint:#6b7591;
  --glass:rgba(30,38,66,.55);--glass-2:rgba(38,48,82,.78);--glass-brd:rgba(255,255,255,.10);--hair:rgba(255,255,255,.08);
  --accent:#7a9cff;--accent-2:#9db6ff;--shadow:0 10px 30px rgba(0,0,0,.35);
  --ok:#3ddc84;--bad:#ff6b6b;--warn:#f5b04a;--pend:#a3b1c6;--info:#8ab4ff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
body::before{width:420px;height:420px;left:-140px;top:-120px;background:radial-gradient(circle,#9fc0ff,transparent 70%)}
body::after{width:460px;height:460px;right:-160px;bottom:-160px;background:radial-gradient(circle,#8fe3ea,transparent 70%)}
@media (prefers-color-scheme: dark){body::before{background:radial-gradient(circle,#3150b5,transparent 70%)}body::after{background:radial-gradient(circle,#0f6d7a,transparent 70%)}}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--glass-2);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;width:100%;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,247,.18)}
textarea{min-height:90px;resize:vertical}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-brd);border-radius:var(--r);box-shadow:var(--shadow)}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(110px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0}
.hide{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top h1{font-size:28px;letter-spacing:-.5px;margin:0;font-weight:700}
.top .sub{font-size:13px;color:var(--muted)}
.circle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--glass-brd);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);cursor:pointer;flex:none}
.circle svg{width:20px;height:20px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.9);box-shadow:var(--shadow);background:linear-gradient(135deg,var(--accent),var(--teal));display:grid;place-items:center;color:#fff;font-weight:700}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite} .sync.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

/* buttons */
.btn{border:1px solid var(--glass-brd);background:var(--glass-2);border-radius:14px;padding:10px 15px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(79,124,247,.35)}
.btn.danger{color:var(--bad)} .btn.sm{padding:7px 11px;font-size:13.5px;border-radius:11px} .btn.block{width:100%}
.btn:active,.circle:active,.tapcard:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.seg{display:flex;padding:4px;gap:4px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-brd);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--glass-2);color:var(--ink);box-shadow:0 2px 8px rgba(31,45,90,.10)}

/* cards & sections */
.card{padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card h3 .link{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
.sect{font-size:20px;font-weight:700;letter-spacing:-.3px;margin:22px 4px 10px;display:flex;align-items:center}
.sect .link{margin-left:auto;font-size:14px;color:var(--accent);font-weight:600;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:14px}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;font-size:17px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:1px}

/* charts */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:rgba(127,140,180,.12);height:100%;justify-content:flex-start}
.chart .stack i{display:block;width:100%}
.chart .x{font-size:10.5px;color:var(--muted);margin-top:6px;height:26px;line-height:12px;text-align:center}
.chart .tv{font-size:10px;color:var(--muted);height:13px}
.chart .c.cur .x{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.donutwrap{display:flex;align-items:center;gap:18px}
.donutwrap svg{width:120px;height:120px;flex:none}
.donutwrap .legend{flex-direction:column;gap:6px;margin:0}
.hbars .b{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.hbars .trk{height:9px;background:rgba(127,140,180,.15);border-radius:6px;overflow:hidden}
.hbars .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.hbars .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;text-align:right;min-width:58px}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer}
.li:last-child{border-bottom:0}
.li .ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.chev{color:var(--faint);font-size:20px}

/* clinic cards */
.clinic{position:relative;overflow:hidden;padding:18px;margin-bottom:12px;cursor:pointer}
.clinic::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--cc);opacity:.18;filter:blur(10px)}
.clinic .nm{font-size:19px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.clinic .meta{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.clinic .meta div{font-size:12.5px;color:var(--muted)} .clinic .meta b{display:block;font-size:18px;color:var(--ink)}

/* calendar */
.cal .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal .hd b{flex:1;text-align:center;font-size:17px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.cal .d.out{visibility:hidden}
.cal .d.work{background:color-mix(in srgb,var(--dc) 18%,transparent);color:var(--ink);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.sel{background:var(--dc,var(--accent));color:#fff;font-weight:700;box-shadow:0 6px 14px color-mix(in srgb,var(--dc,var(--accent)) 40%,transparent)}
.cal .d .n{font-size:9.5px;font-weight:600;opacity:.8;line-height:1}
.cal .d .pd{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cal .d.sel .pd{background:#fff}

/* day panel / patient cards */

<script>
/* =====================================================================
   DentaLog v4 — her dental work log.

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

const DEFAULT_TREATMENTS = ['RECONSTRUCCIÓN','VISITA','URG','CARILLA','FÉRULA','ESSIX','ENTREGA','INCRUSTACIÓN','CORONA','TALLADO'];

  id:'c1', name:'Torreblanca', color:COLORS[0],
  agenda:'Torreblanca',        // text in the Gesden agenda header ("C/Torreblanca N.10")
  invoice:'Sant Joan',         // text in the liquidación/factura (Especialitats Mèdiques Sant Joan)

  clinics:[DEFAULT_CLINIC()],

  treatments: DEFAULT_TREATMENTS.slice(),

});

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m=>m.slice(0,3));
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtLong = s => { const d = fromIso(s); return `${WDL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = fromIso(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtShortY = s => { const d = fromIso(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const monthLabel = ym => { const [y,m]=ym.split('-'); return `${MONTHS[+m-1]} ${y}`; };
const addMonths = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const r2 = v => Math.round(num(v)*100)/100;
const eur = v => num(v).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const eur0 = v => Math.round(num(v)).toLocaleString('es-ES') + ' €';
const decStr = v => (v===''||v==null) ? '' : String(r2(v)).replace('.',',');
const blank = v => v==='' || v==null;
function parseMoney(s){
  if(s==null) return 0; if(typeof s==='number') return s;
  s = String(s).replace(/[€$\s]/g,'').replace(/EUR/i,'');
  if(!s || s==='-') return 0;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc>-1 && ld>-1){ s = lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(lc>-1){ s = s.replace(',','.'); }
  else if(ld>-1 && /\.\d{3}$/.test(s)){ s = s.replace(/\./g,''); }
  const n = parseFloat(s); return isFinite(n)?n:0;
}
const moneyIn = s => String(s).trim()==='' ? '' : r2(parseMoney(s));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load a helper library — check the internet connection.')); document.head.appendChild(s); }); }

const sum = (arr,f) => arr.reduce((a,x)=>a+num(f(x)),0);

const MONEY_RX = /^-?\s*(\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,2})?\s*€?$/;
const DATE_RX = /(\d{1,2})\/(\d{1,2})\/(\d{4})/;
const toIsoD = (d,m,y) => `${y}-${pad(m)}-${pad(d)}`;
const ICON = {

function load(){ let d=null; try{ const s=localStorage.getItem(KEY); if(s) d=JSON.parse(s); }catch(e){} return normalizeDB(d); }

function normalizeDB(d){
  const base = DEFAULT();
  if(!d) return base;
  const out = Object.assign(base, d);
  out.settings = Object.assign(DEFAULT().settings, d.settings||{});
  out.profile = Object.assign(DEFAULT().profile, d.profile||{});
  if(!Array.isArray(out.treatments) || !out.treatments.length) out.treatments = DEFAULT_TREATMENTS.slice();
  ['tomb','liq','manual','patients','stamp'].forEach(k=>{ if(!out[k] || typeof out[k]!=='object' || Array.isArray(out[k])) out[k]={}; });
  if(!Array.isArray(out.clinics) || !out.clinics.length) out.clinics=[DEFAULT_CLINIC()];
  const c0 = out.clinics[0].id;
  out.visits = (out.visits||[]).map(migrateVisit).map(v=>v.clinic ? v : {...v, clinic:c0}).map(v=>{
    if((v.treat||[]).length){ const missing = v.treat.filter(t=>!norm(v.obs).includes(norm(t))); if(missing.length) v = {...v, obs: [missing.join(', '), v.obs].filter(Boolean).join(' · ')}; v = {...v, treat:[]}; }
    return v; });
  for(const k of Object.keys(out.liq)) if(/^\d{4}-\d{2}$/.test(k)){ out.liq[c0+'|'+k]=out.liq[k]; delete out.liq[k]; }
  for(const k of Object.keys(out.manual)) if(/^\d{4}-\d{2}$/.test(k)){ out.manual[c0+'|'+k]=out.manual[k]; delete out.manual[k]; }
  delete out.catalog;
  out.ver = 4;
  return out;
}
// v1–v3 stored a list of "items" ({t, amt, pay}); v4 keeps: treatments, paid at clinic, insurance
function migrateVisit(v){
  if(v.treat) return v;
  const items = Array.isArray(v.items) ? v.items : ((v.treatment || num(v.price)) ? [{t:v.treatment||'', amt:num(v.price), pay:v.method||''}] : []);
  const paidIt = items.filter(i=>i.pay!=='mutua'), insIt = items.filter(i=>i.pay==='mutua');
  const nv = {...v,
    treat: [...new Set(items.map(i=>matchTreatment(i.t)).filter(Boolean))],
    paid: paidIt.length ? r2(sum(paidIt,i=>i.amt)) : '',
    payMethod: paidIt.some(i=>i.pay==='cash') && !paidIt.some(i=>i.pay==='card') ? 'cash' : 'card',
    ins: insIt.length ? r2(sum(insIt,i=>i.amt)) : '',
    insAuto:false, lines: v.lines||[], notes: v.notes||''};
  ['items','treatment','price','method'].forEach(k=>delete nv[k]);
  return nv;
}
function matchTreatment(t){
  const n = norm(t); if(!n) return '';
  const list = (typeof DB!=='undefined' && DB && DB.treatments) || DEFAULT_TREATMENTS;
  const hit = list.find(x=>{ const k = norm(x); return n.startsWith(k.slice(0,5)) || n.includes(k); });
  if(hit) return hit;
  if(/obtur|empast/.test(n)) return list.find(x=>/reconstr/i.test(norm(x))) || '';
  if(/primera visita|1.?visita|consulta|revis/.test(n)) return list.find(x=>/visita/i.test(norm(x))) || '';
  return '';
}
const snapVisit = v => JSON.stringify({...v, upd:0});
function snapshotAll(){
  SNAP = {v:{}, c:{}, l:{}, m:{}, s:{}};
  DB.visits.forEach(v=>SNAP.v[v.id]=snapVisit(v));
  DB.clinics.forEach(c=>SNAP.c[c.id]=JSON.stringify({...c,upd:0}));
  Object.entries(DB.liq).forEach(([k,x])=>SNAP.l[k]=JSON.stringify({...x,upd:0}));
  Object.entries(DB.manual).forEach(([k,x])=>SNAP.m[k]=JSON.stringify({...x,upd:0}));
  ['profile','treatments','settings','patients'].forEach(k=>SNAP.s[k]=JSON.stringify(DB[k]));
}
function stampChanges(){
  const now = Date.now(); let changed = false;
  const track = (list, snap, getId, tombPrefix) => {
    const seen = new Set();
    for(const [id, x] of list){ seen.add(id); const j = JSON.stringify({...x, upd:0}); if(snap[id]!==j){ x.upd = now; snap[id]=j; changed = true; } }
    for(const id of Object.keys(snap)) if(!seen.has(id)){ DB.tomb[tombPrefix+id] = now; delete snap[id]; changed = true; }
  };
  track(DB.visits.map(v=>[v.id,v]), SNAP.v, null, '');
  track(DB.clinics.map(c=>[c.id,c]), SNAP.c, null, 'cl:');
  track(Object.entries(DB.liq), SNAP.l, null, 'liq:');
  track(Object.entries(DB.manual), SNAP.m, null, 'man:');
  ['profile','treatments','settings','patients'].forEach(k=>{ const j = JSON.stringify(DB[k]); if(SNAP.s[k]!==j){ DB.stamp[k]=now; SNAP.s[k]=j; changed = true; } });
  return changed;
}
function save(opts={}){
  const changed = stampChanges();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('⚠️ Could not save on this device — storage is full'); }

}

/* ============ NAMES ============ */
// Gesden names: "GARCIA MORENO , SILVIA", with receptionist flags such as
// "MACIAS MENDOZA **VERIFICAR PACIENTE** , CARMEN" or "SANCHEZ SANCHEZ(OJO COMPROBAR DNI) , VICTOR"
function cleanName(raw){
  const flags = [];
  let s = String(raw||'');
  s = s.replace(/\*\*([^*]+)\*\*/g, (m,a)=>{ flags.push(a.trim()); return ' '; });
  s = s.replace(/\(([^)]*(?:OJO|COMPROB|VERIFIC|DNI)[^)]*)\)/gi, (m,a)=>{ flags.push(a.trim()); return ' '; });
  s = s.replace(/\(\d+\)/g,' ').replace(/\*+/g,' ');
  let [last, first] = s.split(',');
  last = (last||'').replace(/\s+/g,' ').trim(); first = (first||'').replace(/\s+/g,' ').trim();
  return {name: first ? `${last}, ${first}` : last, flags};
}
const STOP = new Set(['de','del','la','las','los','y','i','da','van','von','mª','ma']);
const nameTokens = s => norm(s).replace(/[^a-z\s]/g,' ').split(' ').filter(t=>t.length>1 && !STOP.has(t));
function lev1(a,b){
  if(a===b) return true; if(Math.abs(a.length-b.length)>1) return false;
  let i=0,j=0,e=0; while(i<a.length && j<b.length){ if(a[i]===b[j]){i++;j++;continue} if(++e>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++} }
  return e + (a.length-i) + (b.length-j) <= 1;
}
function nameScore(a,b){
  const A = nameTokens(a), B = nameTokens(b); if(!A.length || !B.length) return 0;
  let m=0; A.forEach(x=>{ if(B.some(y=>x===y || (x.length>=4 && y.length>=4 && (lev1(x,y) || x.startsWith(y) || y.startsWith(x))))) m++; });
  return m / Math.min(A.length, B.length);
}
const displayName = n => titleCase(n);

/* ============ PDF TEXT EXTRACTION ============ */
// pdf.js returns text in drawing order; Gesden draws each field as one string,
// so fields are read by position, not by visual line — that avoids the
// "merged cells" you get when the PDF is converted to Excel.
async function pdfPages(file){
  await loadScript(PDFJS);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const pages = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const H = page.view[3], W = page.view[2];
    const tc = await page.getTextContent();
    const runs = [];
    for(const it of tc.items){
      const x = it.transform[4], top = H - it.transform[5], w = it.width||0, size = Math.abs(it.transform[0])||it.height||10;
      const last = runs[runs.length-1];
      if(!it.str || !it.str.trim()){
        if(it.str && last && w < 6 && Math.abs(last.top-top)<0.6 && Math.abs(x-last.x1) < 1.6) last.x1 = x + w;
        continue;
      }
      if(last && Math.abs(last.top-top)<0.6 && x-last.x1 > -0.6 && x-last.x1 < 1.6){ last.s += (x-last.x1>1 || /\s$/.test(last.s) ? ' ' : '') + it.str; last.x1 = x+w; continue; }
      runs.push({x, x1:x+w, top, s:it.str, size});
    }
    runs.forEach(r=>r.s=r.s.replace(/\s+/g,' ').trim());
    pages.push({W, H, runs});
  }
  return pages;
}
function detectKind(pages){
  const all = pages.slice(0,3).flatMap(p=>p.runs.map(r=>r.s)).join(' | ');
  if(/Listado de Citas/i.test(all)) return 'agenda';
  if(/LIQUIDACI[OÓ]N|Producido|FACTURA/i.test(all)) return 'liq';
  return 'unknown';
}

/* ---------- Agenda ("Listado de Citas") ---------- */
// Column starts (A4 landscape, 842pt): HORA 55, NHC 102, PACIENTE 141, TIPO 280, MUTUA 368,
// phone 450, mobile 511, OBSERVACIONES 567, CONFIRMADA 734. OBSERVACIONES is drawn ~4.5pt
// ABOVE its row and never wraps. One page = one day; long days continue on a second page.
function agendaCol(x, W){
  const k = 841.92 / (W||841.92); x *= k;
  if(x < 92) return 'time'; if(x < 135) return 'nhc'; if(x < 275) return 'patient'; if(x < 362) return 'tipo';
  if(x < 446) return 'mutua'; if(x < 506) return 'tel1'; if(x < 562) return 'tel2'; if(x < 728) return 'obs'; return 'conf';
}
function parseAgenda(pages){
  const days = new Map(); let prevKey = null;
  pages.forEach((pg, pi) => {
    const R = pg.runs;
    const doctor = (R.find(r=>/\bDr[a]?\.\s?/i.test(r.s) && r.top < 150) || {}).s || '';
    const dRun = R.find(r=>/^\d{2}\/\d{2}\/\d{4}$/.test(r.s) && r.top < 150);
    let date = null; if(dRun){ const m = dRun.s.match(DATE_RX); date = toIsoD(m[1],m[2],m[3]); }
    const key = date ? `${date}|${doctor}` : prevKey;
    if(!key) return; prevKey = key;
    if(!days.has(key)) days.set(key, {date:key.split('|')[0], doctor:key.split('|')[1], rows:[], expected:null});
    const day = days.get(key);
    const hdr = R.find(r=>r.s==='HORA'); const hdrTop = hdr ? hdr.top : 160;
    const foot = R.find(r=>/Duraci[oó]n Estimada|Total Citas/i.test(r.s)); const footTop = foot ? foot.top : 1e9;
    const tc = R.find(r=>/^Total Citas$/i.test(r.s));
    if(tc){ const n = R.find(r=>Math.abs(r.top-tc.top)<1.5 && /^\d+$/.test(r.s)); if(n) day.expected = +n.s; }
    const body = R.filter(r=>r.top > hdrTop+3 && r.top < footTop-2);
    const rows = body.filter(r=>agendaCol(r.x,pg.W)==='time' && /^\d{1,2}[:.]\d{2}$/.test(r.s)).sort((a,b)=>a.top-b.top)
      .map(r=>({top:r.top, time:r.s.replace('.',':').padStart(5,'0'), f:{}}));
    for(const r of body){
      const col = agendaCol(r.x, pg.W);
      if(col==='time' && /^\d{1,2}[:.]\d{2}$/.test(r.s)) continue;
      let row;
      if(col==='obs'){ row = rows.find(x=> x.top - r.top > 1 && x.top - r.top < 12) || rows.find(x=>Math.abs(x.top-r.top)<1.5); }
      else row = rows.find(x=>Math.abs(x.top-r.top)<1.5);
      if(!row) continue;
      const txt = (col==='obs' && r.x1 > pg.W - 8) ? r.s + '…' : r.s;
      row.f[col] = row.f[col] ? row.f[col] + ' ' + txt : txt;
    }
    for(const r of rows){
      const {name, flags} = cleanName(r.f.patient||'');
      const nhc = (r.f.nhc||'').replace(/\D/g,'');
      const phone = [r.f.tel1, r.f.tel2].filter(Boolean).join(' / ');
      const conf = r.f.conf || '';
      day.rows.push({time:r.time, nhc, name, flags, mutua:(r.f.mutua||'').trim(), phone,
        obs:(r.f.obs||'').replace(/<br>/gi,' ').replace(/\s+/g,' ').trim(),
        confirmed: /confirmada/i.test(conf) && !/no\s*confirmada/i.test(conf),
        isNote: !nhc && !phone});
    }
  });
  return [...days.values()].sort((a,b)=>a.date.localeCompare(b.date) || a.doctor.localeCompare(b.doctor));
}

/* ---------- Monthly liquidación + factura ---------- */
// Excel export printed to PDF; columns are located from each page's own header
// (Día | Paciente | Descripcion | Mutua | Producido). The payment column sits to the right
// of Producido, or — when it doesn't fit — on extra pages at the end at the row's height.
function groupLines(runs, tol=1.6){
  const lines = [];
  runs.slice().sort((a,b)=>a.top-b.top || a.x-b.x).forEach(r=>{
    let l = lines.find(l=>Math.abs(l.top-r.top)<tol);
    if(!l){ l={top:r.top, runs:[]}; lines.push(l); }
    l.runs.push(r);
  });
  lines.forEach(l=>l.runs.sort((a,b)=>a.x-b.x));
  return lines.sort((a,b)=>a.top-b.top);
}
function liqLayout(runs){
  const f = rx => runs.find(r=>rx.test(r.s));
  const pac=f(/^Paciente$/i), desc=f(/^Descripci[oó]n$/i), mut=f(/^Mutua$/i), prod=f(/^Producido$/i);
  if(!(pac && desc && mut && prod)) return null;
  return {pac:pac.x, desc:desc.x, mut:mut.x, prod:prod.x, amtB: mut.x + (prod.x-mut.x)*0.75, payB: prod.x + 40};
}
const DEFAULT_LAYOUT = {pac:101.5, desc:276.6, mut:637.9, prod:744.2, amtB:717, payB:784};
function liqCol(x, L){
  if(x < L.pac-3) return 'date';
  if(x < L.desc-3) return x < L.pac+30 ? 'last' : 'first';
  if(x < L.mut-3) return 'desc';
  if(x < L.amtB) return 'mutua';
  if(x < L.payB) return 'amt';
  return 'pay';
}
const payKind = t => /tarjeta|card|tpv|cr[eé]dito/i.test(t) ? 'card' : /efectivo|cash|contado/i.test(t) ? 'cash' : 'other';
function parseLiq(pages){
  const res = {lines:[], summary:[], factura:{}, share:null, month:null, warnings:[], text:''};
  const dataPages = [], payPages = []; let L = null;
  res.text = pages.flatMap(p=>p.runs.map(r=>r.s)).join(' ');
  pages.forEach((pg, pi) => {
    const lines = groupLines(pg.runs);
    const txt = pg.runs.map(r=>r.s).join(' ');
    if(/FACTURA|TOTAL A PERCIBIR|Importe Total Bruto/i.test(txt) && !/Producido/i.test(txt)){
      for(const l of lines){
        const lbl = l.runs.map(r=>r.s).join(' ');
        const val = [...l.runs].reverse().find(r=>MONEY_RX.test(r.s.replace(/\s/g,'')));
        if(/FECHA:/i.test(lbl)){ const m=lbl.match(DATE_RX); if(m) res.factura.date = toIsoD(m[1],m[2],m[3]); }
        else if(/N.\s*DE FACTURA/i.test(lbl)) res.factura.number = l.runs[l.runs.length-1].s;
        else if(/Importe Total Bruto/i.test(lbl) && val) res.factura.gross = parseMoney(val.s);
        else if(/Retenci[oó]n IRPF/i.test(lbl)){ const p = lbl.match(/(\d+(?:[.,]\d+)?)\s*%/); if(p) res.factura.irpfPct = parseMoney(p[1]); if(val) res.factura.irpf = parseMoney(val.s); }
        else if(/TOTAL A PERCIBIR/i.test(lbl) && val) res.factura.net = parseMoney(val.s);
        else if(/hasta|a partir/i.test(lbl)) res.warnings.push('Clinic note: '+lbl);
      }
      return;
    }
    L = liqLayout(pg.runs) || L || DEFAULT_LAYOUT;
    const share = txt.match(/TRATAMIENTOS\s+(\d+)\s*%/i); if(share) res.share = +share[1];
    const pageLines = [], payCand = [];
    for(const l of lines){
      const f = {}; l.runs.forEach(r=>{ const c = liqCol(r.x, L); f[c] = f[c] ? f[c]+' '+r.s : r.s; });
      const amtOk = f.amt && MONEY_RX.test(f.amt.replace(/\s/g,''));
      if(amtOk && (f.last || f.first)){ pageLines.push({top:l.top, f}); continue; }
      const label = [f.desc, f.mutua].filter(Boolean).join(' ').trim();
      if(label && !f.date && !f.last && /TOTAL|%|DTO|Lab/i.test(label)){
        const nums = l.runs.filter(r=>r.x >= L.amtB-2 && /\d/.test(r.s)).map(r=>r.s);
        let v = nums.length ? parseMoney(nums[nums.length-1].replace(/^-\s+/,'-')) : 0;
        if(/DTO|Lab\.?/i.test(label) && v>0) v = -v;
        res.summary.push({label, amount:v}); continue;
      }
      if(!label && !amtOk && f.date && !f.last && !/\d{2}\/\d{2}/.test(f.date)) payCand.push({pi, top:l.top, text:f.date});
    }
    if(pageLines.length) dataPages.push({pi, lines:pageLines});
    else if(payCand.length && payCand.length===lines.length) payPages.push(...payCand);
  });
  let prevDate = null; const flat = [];
  dataPages.forEach((dp, di) => dp.lines.forEach(l => {
    const f = l.f; let date = null, refDate = null;
    const all = (f.date||'').match(/\d{1,2}\/\d{1,2}\/\d{4}/g) || [];
    if((f.date||'').trim().length===10 && all.length===1){ const m = all[0].match(DATE_RX); date = toIsoD(m[1],m[2],m[3]); }
    else if(f.date){ const m = f.date.match(DATE_RX); if(m) refDate = toIsoD(m[1],m[2],m[3]); date = prevDate; res.warnings.push(`A date cell was unreadable ("${f.date}") — used ${fmtDate(prevDate||'')} from the row above.`); }
    else date = prevDate;
    prevDate = date || prevDate;
    const desc = (f.desc||'').replace(/\s+/g,' ').trim();
    flat.push({di, top:l.top, date, refDate, name:[f.last,f.first].filter(Boolean).join(', ').replace(/\s+/g,' ').trim(),
      desc, mutua:(f.mutua||'').replace(/^-\s*|\s*-$/g,'').trim(), amt:parseMoney((f.amt||'').replace(/^-\s+/,'-')),
      note:(desc.match(/\[(.*?)\]/)||[])[1]||'', pay: f.pay ? payKind(f.pay) : '', payText: f.pay||''});
  }));
  [...new Set(payPages.map(p=>p.pi))].forEach((pi, i) => {
    payPages.filter(p=>p.pi===pi).forEach(p=>{ const row = flat.find(r=>r.di===i && Math.abs(r.top-p.top)<1.6); if(row){ row.payText=p.text; row.pay=payKind(p.text); } });
  });
  res.lines = flat.map(({di,top,...r})=>({...r, id:uid()}));
  res.hasPayInfo = res.lines.some(l=>l.payText);
  const cnt = {}; res.lines.forEach(l=>{ if(l.date){ const m=l.date.slice(0,7); cnt[m]=(cnt[m]||0)+1; } });
  res.month = (res.factura.date && res.factura.date.slice(0,7)) || Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
  const S = res.summary;
  const totals = S.map((s,i)=>({...s,i})).filter(s=>/^TOTAL/i.test(s.label));
  const pctLines = S.map((s,i)=>({...s,i})).filter(s=>/^\d+(?:[.,]\d+)?\s*%$/.test(s.label));
  res.tiers = pctLines.map(p=>{ const base = [...totals].reverse().find(t=>t.i < p.i); return {label: base?base.label:'TOTAL', base: base?base.amount:null, pct: parseMoney(p.label), amount: p.amount}; });
  const used = new Set(res.tiers.map(t=>t.label+'|'+t.base));
  const final = totals.filter(t=>!used.has(t.label+'|'+t.amount));
  res.totalProduced = res.tiers.length ? sum(res.tiers,t=>t.base) : (totals[0]?.amount ?? null);
  res.shareAmount = res.tiers.length ? r2(sum(res.tiers,t=>t.amount)) : null;
  res.liquidation = final.length ? final[final.length-1].amount : (res.factura.gross ?? null);
  const dto = S.find(s=>/DTO/i.test(s.label)); if(dto){ res.cardFee = dto.amount; const b = dto.label.match(/\(([\d.,]+)/); res.cardBase = b ? parseMoney(b[1]) : null; }
  const lab = S.find(s=>/^Lab/i.test(s.label)); if(lab){ res.labDeduction = lab.amount; const b = lab.label.match(/Lab\.?\s*\(?\s*(\d[\d.,]*)/i); res.labCost = b ? parseMoney(b[1]) : 0;
    if(!b && lab.amount){ res.labCost = r2(-lab.amount*100/(res.share||40)); res.warnings.push(`Lab cost isn't written in the PDF ("${lab.label}") — worked back from the ${eur(-lab.amount)} deduction: ${eur(res.labCost)}.`); } }
  if(res.factura.gross==null) res.warnings.push('This PDF has no invoice page — only the liquidación list.');
  return res;
}

function stackedBars(months, series, opts={}){
  const tot = months.map((_,i)=>sum(series,s=>s.values[i]));
  const max = Math.max(1, ...tot);
  return `<div class="chart">${months.map((m,i)=>`<div class="c ${m===opts.hi?'cur':''} ${opts.click?'tap':''}" data-ym="${m}" title="${monthLabel(m)}: ${tot[i]}">
      <div class="tv">${tot[i]||''}</div>
      <div class="stack" style="height:calc(100% - 42px)"><div style="height:${(tot[i]/max*100).toFixed(1)}%;display:flex;flex-direction:column-reverse;width:100%">${series.map(s=>s.values[i]?`<i style="background:${s.color};flex:${s.values[i]}"></i>`:'').join('')}</div></div>
      <div class="x">${MON[+m.slice(5)-1].slice(0,1)}${m.slice(5)==='01'?'<br>'+m.slice(2,4):''}</div></div>`).join('')}</div>

}
function donut(entries){
  const total = sum(entries,e=>e.value)||1; let acc = 0; const R=42, C=2*Math.PI*R;
  return `<div class="donutwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(127,140,180,.15)" stroke-width="16"/>
    ${entries.map(e=>{ const len = e.value/total*C; const seg = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${e.color}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc+C/4).toFixed(2)}"/>`; acc+=len; return seg; }).join('')}
    <text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${sum(entries,e=>e.value)}</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">patients</text></svg>
    <div class="legend">${entries.map(e=>`<span><i class="dot" style="background:${e.color}"></i>${esc(e.label)} · ${Math.round(e.value/total*100)}%</span>`).join('')}</div></div>`;
}

function calendarHtml(ym, marks, sel, color, id){

  const first = new Date(y, m-1, 1), days = new Date(y, m, 0).getDate();
  const lead = (first.getDay()+6)%7, t = today();
  let cells = '';
  for(let i=0;i<lead;i++) cells += `<div class="d out"></div>`;
  for(let d=1; d<=days; d++){
    const ds = `${ym}-${pad(d)}`, mk = marks[ds];
    cells += `<div class="d ${mk?'work':''} ${ds===t?'today':''} ${ds===sel?'sel':''}" data-day="${ds}" style="--dc:${mk&&mk.color||color}">${d}${mk&&mk.n?`<span class="n">${mk.n}</span>`:''}${mk&&mk.pending?'<span class="pd"></span>':''}</div>`;
  }
  return `<div class="cal" id="${id}"><div class="hd"><div class="circle sm" data-cm="-1">${ICON.back}</div><b data-cm="0">${monthLabel(ym)}</b><div class="circle sm flip" data-cm="1">${ICON.back}</div></div>

}

    ${list.length ? `<div class="row" style="margin-bottom:12px">${pend.length?`<button class="btn sm" id="dAll">✓ All pending came</button>`:''}<button class="btn sm" id="dAdd">＋ Patient</button><button class="btn sm" id="dImp">${ICON.pdf} Import PDF</button></div>
      <div class="glass list" id="dList">${list.map(v=>patientRow(v, showClinic)).join('')}</div>`
    : `<div class="glass card empty"><b>No patients on this day</b>Import the Gesden agenda for this day (or a whole month), or add a patient.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="dImp">${ICON.pdf} Import PDF</button><button class="btn" id="dAdd">＋ Patient</button></div></div>`}`;

/* ============ PATIENT ROWS ============ */
const STATUS_CLS = {pending:'p', attended:'ok', noshow:'bad', cancelled:'w'};
const hasHistory = v => !!v.nhc && DB.visits.some(x=>x.id!==v.id && x.nhc===v.nhc && nameScore(x.patient, v.patient)>=0.8);
function patientRow(v, showClinic){
  const warn = v.check || (v.flags||[]).length;
  return `<div class="prow ${v.status}" data-id="${v.id}">
    <div class="tm">${esc(v.time||'—')}</div>
    <div class="grow" data-edit>
      <div class="nm">${showClinic?`<i class="dot" style="background:${esc(clinicById(v.clinic).color)}"></i> `:''}${esc(displayName(v.patient))}${warn?' <span class="warn" title="'+esc(v.check||v.flags.join(', '))+'">⚠</span>':''}</div>
      ${v.obs?`<div class="ob">${esc(v.obs)}</div>`:''}
      ${v.notes?`<div class="cm">💬 ${esc(v.notes)}</div>`:''}
    </div>
    <div class="rt">
      <button class="spill ${STATUS_CLS[v.status]}" data-status>${STATUS[v.status]}</button>
      ${hasHistory(v)?`<button class="hbtn" data-hist title="History">🗂 History</button>`:''}
    </div>
  </div>`;
}
function bindRows(root, rerender){
  root.onclick = e => {
    const row = e.target.closest('[data-id]'); if(!row) return;
    const v = DB.visits.find(x=>x.id===row.dataset.id); if(!v) return;
    if(e.target.closest('[data-status]')) return statusMenu(v, rerender);
    if(e.target.closest('[data-hist]')) return openHistory(v);
    openPatient(v, {onDone: rerender});
  };
}
function statusMenu(v, after){
  const ov = sheet(`<h2>${esc(displayName(v.patient))}</h2><div class="small muted" style="margin-bottom:12px">${fmtShortY(v.date)} · ${esc(v.time||'')}</div>
    <div class="stmenu">${Object.entries(STATUS).map(([k,l])=>`<button class="spill big ${STATUS_CLS[k]} ${v.status===k?'cur':''}" data-s="${k}">${{pending:'⏳',attended:'✓',noshow:'✗',cancelled:'⊘'}[k]} ${l}</button>`).join('')}</div>`);
  ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ v.status = b.dataset.s; save(); ov.remove(); after && after(); });
}
function sheet(html, cls=''){
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `<div class="sheet ${cls}"><div class="grab"></div>${html}</div>`;
  ov.addEventListener('click', e => { if(e.target===ov || e.target.closest('[data-x]')) ov.remove(); });
  document.body.appendChild(ov); return ov;
}

function treatmentsOf(v){

function renderPatients(){

/* ============ IMPORT ============ */
let importClinic = null;
function startImport(cid){ importClinic = cid; $('#pdfFile').click(); }
$('#pdfFile').onchange = async e => {
  const files = [...e.target.files]; e.target.value='';
  for(const f of files){
    try{
      toast('Reading '+f.name+'…');
      const pages = await pdfPages(f);
      const kind = detectKind(pages);
      if(kind==='agenda') await openAgendaPreview(parseAgenda(pages), f.name);
      else if(kind==='liq') await openLiqPreview(parseLiq(pages), f.name);
      else alert(`"${f.name}" doesn't look like a Gesden agenda or a clinic liquidación.`);
    }catch(err){ alert('PDF import failed: '+err.message); console.error(err); }
  }
};
function existingFor(date, row, clinic){
  const same = DB.visits.filter(v=>v.date===date && v.clinic===clinic);
  return same.find(v=>((row.nhc && v.nhc===row.nhc) || (!row.nhc && nameScore(v.origPatient||v.patient,row.name)>=0.8)) && (!v.time || !row.time || v.time===row.time))
      || same.find(v=>row.nhc && v.nhc===row.nhc)
      || same.find(v=>!v.nhc && v.source==='excel' && nameScore(v.patient,row.name)>=0.8)
      || same.find(v=>v.time && v.time===row.time && nameScore(v.origPatient||v.patient,row.name)>=0.5);
}
function openAgendaPreview(days, fname){ return new Promise(done => {
  const key = norm(DB.settings.doctor);
  const doctors = [...new Set(days.map(d=>d.doctor))];
  const mine = d => key && norm(d).includes(key);
  const sel = {}; doctors.forEach(d=>sel[d] = mine(d) || (!key && doctors.length===1));
  const detected = detectClinic(days.map(d=>d.doctor).join(' '), 'agenda');
  let clinic = (detected || (importClinic && clinicById(importClinic)) || DB.clinics[0]).id;
  let statusMode = 'pending';
  days.forEach(d=>d.rows.forEach(r=>{ if(r.status===undefined) r.status = r.isNote ? 'cancelled' : statusMode; }));
  const ov = sheet('', 'wide');
  const box = ov.querySelector('.sheet');
  const finish = () => { ov.remove(); done(); };
  const draw = () => {
    days.forEach(d=>d.rows.forEach(r=>{ if(r.use===undefined) r.use = !r.isNote; r.exists = !!existingFor(d.date, r, clinic); const fix = r.nhc && DB.patients[r.nhc]; if(r.final===undefined){ r.final = fix ? fix.name : r.name; r.fixed = !!fix; } }));
    const shown = days.filter(d=>sel[d.doctor]);
    const nNew = shown.reduce((a,d)=>a+d.rows.filter(r=>r.use && !r.exists).length,0);
    const nUpd = shown.reduce((a,d)=>a+d.rows.filter(r=>r.use && r.exists).length,0);

      <div class="muted small">${esc(fname)}</div>

// attach liquidación lines to visits; fill insurance for mutua patients
function matchLineVisit(l, visits){
  let best=null, bs=0;
  for(const v of visits) if(v.date===l.date){ const s = nameScore(v.patient, l.name) + (attended(v)?0.01:0); if(s>bs){bs=s;best=v;} }
  return bs>=0.6 ? best : null;
}
// Insurance = invoice − cash. Equal → 0 €. Invoice lower than cash → flag for a manual check.
function computeIns(v){
  const tot = r2(billedTotal(v)), cash = num(v.paid);
  if(!(v.lines||[]).length){ if(v.insAuto){ v.ins=''; v.insAuto=false; } v.check=''; return 'none'; }
  if(!blank(v.ins) && !v.insAuto){ v.check = Math.abs(r2(cash+num(v.ins)) - tot) > 0.01 ? `Cash + insurance (${eur(cash+num(v.ins))}) ≠ invoice (${eur(tot)})` : ''; return v.check?'check':'manual'; }
  if(tot > cash + 0.005){ v.ins = r2(tot-cash); v.insAuto = true; v.check=''; return 'filled'; }
  if(Math.abs(tot-cash) <= 0.005){ v.ins = 0; v.insAuto = true; v.check=''; return 'zero'; }
  v.ins = ''; v.insAuto = false; v.check = `Invoice ${eur(tot)} is less than cash paid at clinic ${eur(cash)} — check`; return 'check';
}
function applyLiq(cid, ym){
  const L = DB.liq[lkey(cid, ym)]; const visits = DB.visits.filter(v=>v.clinic===cid && v.date.startsWith(ym));
  visits.forEach(v=>{ v.lines = []; });
  let matched = 0, insFilled = 0, checks = 0;
  for(const l of L.lines){
    if(l.amt<0 || l.note) continue;
    const v = matchLineVisit(l, visits); l.vid = v ? v.id : null;
    if(v) v.lines.push({desc:l.desc, amt:l.amt, pay:l.pay, mutua:l.mutua});
  }
  for(const v of visits){
    if(v.lines.length){ matched++; if(v.status==='pending') v.status='attended'; if(!v.obs) v.obs = [...new Set(v.lines.map(l=>titleCase(l.desc.replace(/\[.*?\]/,'').trim())))].join(', '); }
    const r = computeIns(v); if(r==='filled'||r==='zero') insFilled++; if(r==='check') checks++;
  }
  return {matched, insFilled, checks};
}

/* ============ RECONCILIATION ============ */
const monthVisits = (ym, cid) => DB.visits.filter(v=>v.date.startsWith(ym) && (!cid || v.clinic===cid));
function reconcile(ym, cid){
  const liq = DB.liq[lkey(cid, ym)];
  const visits = monthVisits(ym, cid), att = visits.filter(attended);
  const R = {ok:[], diff:[], missing:[], extra:[], corr:[], unfilled:[], pending: visits.filter(v=>v.status==='pending')};
  if(!liq) return R;
  for(const l of liq.lines){
    if(l.amt<0 || l.note){ R.corr.push({l}); continue; }
    const v = matchLineVisit(l, visits);
    if(!v || !attended(v)) R.extra.push({l, v});
  }
  for(const v of att){
    const clin = (v.lines||[]).length ? r2(billedTotal(v)) : null;
    const her = hasMoney(v) ? r2(visitTotal(v)) : null;
    if(clin!=null){
      if(her==null && clin===0) R.ok.push({v, her:0, clinic:0});
      else if(her==null) R.diff.push({v, her:0, clinic:clin, unfilled:true});
      else if(Math.abs(her-clin)<0.01 && !v.check) R.ok.push({v, her, clinic:clin});
      else R.diff.push({v, her, clinic:clin});
    } else if(her) R.missing.push({v, her});
  }
  return R;
}
function herCalc(ym, cid){
  const c = clinicById(cid), fee = num(c.cardFee)/100, top = Math.max(...(c.shares||[{pct:40}]).map(x=>num(x.pct)));
  const att = monthVisits(ym, cid).filter(attended);
  let prod=0, card=0, shareAmt=0, feeAmt=0;
  att.forEach(v=>{ const sh = shareFor(cid, v.date)/100; const t = visitTotal(v); prod+=t; shareAmt+=t*sh;
    if(sh*100>=top){ const c = (v.lines||[]).length ? sum(v.lines.filter(l=>l.pay==='card'), l=>l.amt) : (v.payMethod==='cash' ? 0 : num(v.paid)); card+=c; feeAmt+=c*sh*fee; } });
  const liq = DB.liq[lkey(cid, ym)], man = DB.manual[lkey(cid, ym)] || {};
  const lab = !blank(man.lab) ? num(man.lab) : (liq?.labCost ?? 0);
  const labAmt = lab * shareFor(cid, ym+'-28')/100;
  const res = {prod, card, lab, shareAmt, feeAmt, labAmt};
  res.liquidation = shareAmt - feeAmt - labAmt;
  res.irpf = res.liquidation * DB.settings.irpf/100; res.net = res.liquidation - res.irpf;
  return res;
}
function clinicChecks(liq, cid){
  const c = clinicById(cid), mainPct = liq.share || shareFor(cid, (liq.month||'')+'-28');
  const C = []; const lines = r2(sum(liq.lines,l=>l.amt));
  const tick = (label, a, b) => C.push({label, ok: a!=null && b!=null && Math.abs(a-b) < 0.02, a, b});
  if(liq.lines.length && liq.totalProduced!=null) tick('Lines add up to the totals', lines, r2(liq.totalProduced));
  (liq.tiers||[]).forEach(t=>{ if(t.base!=null) tick(`${t.pct}% of ${t.label.replace(/:$/,'')}`, r2(t.base*t.pct/100), t.amount); });
  if(liq.cardFee!=null){
    const cardLines = liq.hasPayInfo ? r2(sum(liq.lines.filter(l=>l.pay==='card' && (!l.date || shareFor(cid,l.date)>=mainPct)),l=>l.amt)) : null;
    const base = cardLines ?? liq.cardBase;
    if(base!=null) tick(`Card fee ${String(c.cardFee).replace('.',',')}% × ${mainPct}% of ${eur(base)}`, r2(-base*mainPct/100*c.cardFee/100), liq.cardFee);
    const feeOk = C.length && C[C.length-1].ok;
    if(cardLines!=null && liq.cardBase){ tick('Card total written in the label', cardLines, liq.cardBase); if(feeOk && !C[C.length-1].ok) C[C.length-1].note = true; }
  }
  if(liq.labDeduction!=null) tick(`Lab = ${mainPct}% of ${eur(liq.labCost||0)}`, r2(-(liq.labCost||0)*mainPct/100), r2(liq.labDeduction));
  if(liq.liquidation!=null && liq.shareAmount!=null) tick('Liquidation = share − fee − lab', r2(liq.shareAmount + (liq.cardFee||0) + (liq.labDeduction||0)), liq.liquidation);
  if(liq.factura.gross!=null && liq.liquidation!=null) tick('Invoice gross = liquidation', liq.factura.gross, liq.liquidation);
  if(liq.factura.irpf!=null && liq.factura.gross!=null) tick(`IRPF ${liq.factura.irpfPct??DB.settings.irpf}%`, r2(liq.factura.gross*(liq.factura.irpfPct??DB.settings.irpf)/100), liq.factura.irpf);
  if(liq.factura.net!=null && liq.factura.gross!=null) tick('To receive = gross − IRPF', r2(liq.factura.gross-(liq.factura.irpf||0)), liq.factura.net);
  return C;
}

function renderStats(c){
  const t = today(), ym = t.slice(0,7), cid = c.id;

  const rec = months.map(m=>DB.liq[lkey(cid,m)]?.factura?.net ?? null);
  const max = Math.max(1,...prod);
  const yr = DB.visits.filter(v=>v.clinic===cid && attended(v) && v.date.startsWith(t.slice(0,4)));
  const tr = {}; yr.forEach(v=>treatmentsOf(v).forEach(x=>tr[x]=(tr[x]||0)+1));
  const trE = Object.entries(tr).sort((a,b)=>b[1]-a[1]).slice(0,10); const trMax = Math.max(1,...trE.map(x=>x[1]));
  const mu = {}; yr.forEach(v=>{ const k = isPrivate(v.mutua)?'Private':titleCase(v.mutua); mu[k]=mu[k]||[0,0]; mu[k][0]+=visitTotal(v); mu[k][1]++; });

      ${rec.some(x=>x!=null)?`<div class="small muted" style="margin-top:10px">Received after IRPF: ${months.map((m,i)=>rec[i]!=null?MON[+m.slice(5)-1]+' '+eur0(rec[i]):'').filter(Boolean).join(' · ')}</div>`:''}</div>

/* ============ SYNC (encrypted, GitHub) ============ */
const Sync = (() => {
  const FILE = 'dentalog.enc.json';
  const state = {cls:'', msg:'', short:''};
  let timer = null, running = false, again = false, keyCache = {};
  const configured = () => !!(LOCAL.sync && LOCAL.sync.token && LOCAL.sync.pass);
  function setState(cls, short, msg){ Object.assign(state, {cls, short, msg}); const b = document.querySelector('.sync'); if(b){ b.className = 'sync '+cls; b.innerHTML = '<i></i>'+esc(short); b.title = msg; } }
  const b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s.replace(/\s/g,'')), c=>c.charCodeAt(0));
  async function key(pass, salt){
    const id = salt + '|' + pass; if(keyCache[id]) return keyCache[id];
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return keyCache[id] = await crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(salt), iterations:210000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  }
  async function pipe(u8, stream){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
  async function encrypt(obj, pass){
    let data = new TextEncoder().encode(JSON.stringify(obj)); let gz = false;
    if(typeof CompressionStream!=='undefined'){ data = await pipe(data, new CompressionStream('gzip')); gz = true; }
    const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await key(pass, salt), data));
    return JSON.stringify({app:'DentaLog', v:1, kdf:'PBKDF2-SHA256-210000', alg:'AES-256-GCM', gz, salt, iv:b64(iv), ct:b64(ct), at:new Date().toISOString()});
  }
  async function decrypt(text, pass){
    const f = JSON.parse(text);
    let data;
    try{ data = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(f.iv)}, await key(pass, f.salt), unb64(f.ct))); }
    catch(e){ throw new Error('Wrong passphrase — it must be the same on every device.'); }
    if(f.gz){ if(typeof DecompressionStream==='undefined') throw new Error('This browser is too old to read the synced data.'); data = await pipe(data, new DecompressionStream('gzip')); }
    return JSON.parse(new TextDecoder().decode(data));
  }
  async function api(path, opts={}){
    const c = LOCAL.sync;
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {cache:'no-store', ...opts,
      headers:{Authorization:'Bearer '+c.token, 'X-GitHub-Api-Version':'2022-11-28', Accept:'application/vnd.github+json', ...(opts.headers||{})}});
    return r;
  }
  async function getRemote(){
    const r = await api(`/contents/${FILE}?t=${Date.now()}`);
    if(r.status===404){ const rr = await api(''); if(rr.status===404) throw new Error('Repository not found — check the name, and that the token has access to it.'); if(rr.status===401) throw new Error('The token was rejected (expired or wrong).'); return null; }
    if(r.status===401) throw new Error('The token was rejected (expired or wrong).');
    if(r.status===403) throw new Error('The token has no access — give it "Contents: Read and write" on this repo.');
    if(!r.ok) throw new Error('GitHub error '+r.status);
    const j = await r.json();
    let text;
    if(j.content && j.encoding==='base64') text = new TextDecoder().decode(unb64(j.content));
    else { const raw = await api(`/contents/${FILE}?t=${Date.now()}`, {headers:{Accept:'application/vnd.github.raw'}}); text = await raw.text(); }
    return {sha:j.sha, text};
  }
  async function putRemote(text, sha){
    const body = {message:`DentaLog sync ${new Date().toISOString().slice(0,16).replace('T',' ')}`, content: b64(new TextEncoder().encode(text))};
    if(sha) body.sha = sha;
    const r = await api(`/contents/${FILE}`, {method:'PUT', body:JSON.stringify(body), headers:{'Content-Type':'application/json'}});
    if(r.status===409 || r.status===422) return 'conflict';
    if(r.status===403 || r.status===404) throw new Error('No write access — the token needs "Contents: Read and write".');
    if(!r.ok) throw new Error('GitHub error '+r.status);
    return 'ok';
  }
  // merge two databases record by record (newest wins, deletions are remembered)
  function merge(a, b){
    const out = structuredClone(a);
    const tomb = {...(a.tomb||{})}; Object.entries(b.tomb||{}).forEach(([k,t])=>{ if(!tomb[k] || t>tomb[k]) tomb[k]=t; });
    out.tomb = tomb;
    const byId = new Map(out.visits.map(v=>[v.id,v]));
    (b.visits||[]).forEach(v=>{ const x = byId.get(v.id); if(!x || (v.upd||0) > (x.upd||0)) byId.set(v.id, v); });
    out.visits = [...byId.values()].filter(v=>!(tomb[v.id] && tomb[v.id] >= (v.upd||0)));
    const cl = new Map(out.clinics.map(c=>[c.id,c])); (b.clinics||[]).forEach(c=>{ const x = cl.get(c.id); if(!x || (c.upd||0) > (x.upd||0)) cl.set(c.id, c); });
    out.clinics = [...cl.values()].filter(c=>!(tomb['cl:'+c.id] && tomb['cl:'+c.id] >= (c.upd||0)));
    if(!out.clinics.length) out.clinics = a.clinics;
    for(const [field, pre] of [['liq','liq:'],['manual','man:']]){
      const m = {...(out[field]||{})}; Object.entries(b[field]||{}).forEach(([k,x])=>{ if(!m[k] || (x.upd||0) > (m[k].upd||0)) m[k]=x; });
      Object.keys(m).forEach(k=>{ if(tomb[pre+k] && tomb[pre+k] >= (m[k].upd||0)) delete m[k]; }); out[field] = m;
    }
    out.stamp = {...(a.stamp||{})};
    ['profile','treatments','settings','patients'].forEach(k=>{ if((b.stamp?.[k]||0) > (a.stamp?.[k]||0)){ out[k] = b[k]; out.stamp[k] = b.stamp[k]; } });
    return normalizeDB(out);
  }
  async function run(manual=false){
    if(!configured()) return;
    if(running){ again = true; return; }
    if(!navigator.onLine){ setState('err','offline','Offline — will sync when back online'); return; }
    running = true; setState('busy','syncing','Syncing…');
    try{
      for(let attempt=0; attempt<3; attempt++){
        save({noSync:true});
        const remote = await getRemote();
        let merged = DB, remoteDB = null;
        if(remote){ remoteDB = normalizeDB(await decrypt(remote.text, LOCAL.sync.pass)); merged = merge(DB, remoteDB); }
        const mergedJson = JSON.stringify(merged);
        if(mergedJson !== JSON.stringify(DB)){ DB = merged; snapshotAll(); try{ localStorage.setItem(KEY, mergedJson); }catch(e){} if(UI.screen!=='settings' && !document.querySelector('.overlay')) render(); }
        if(!remoteDB || JSON.stringify(normalizeDB(remoteDB)) !== mergedJson){
          const res = await putRemote(await encrypt(DB, LOCAL.sync.pass), remote && remote.sha);
          if(res==='conflict') continue;
        }
        LOCAL.lastSync = Date.now(); saveLocal();
        setState('ok','synced','Up to date'); break;
      }
    }catch(err){ setState('err','sync error', err.message); if(manual) alert('Sync: '+err.message); }
    running = false;
    if(again){ again = false; schedule(); }
  }
  function schedule(){ if(!configured()) return; clearTimeout(timer); setState('busy','saving','Changes waiting to sync'); timer = setTimeout(run, 2500); }
  async function connect(cfg){
    LOCAL.sync = cfg; saveLocal();
    try{ await run(true); if(state.cls==='err') throw new Error(state.msg); }
    catch(err){ delete LOCAL.sync; saveLocal(); setState('','',''); throw err; }
  }
  window.addEventListener('online', ()=>run());
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && configured() && Date.now()-(LOCAL.lastSync||0) > 20000) run(); });
  return {configured, run, schedule, connect, state, setState, merge, encrypt, decrypt};
})();

/* ============ BACKUP / EXCEL ============ */
async function shareOrDownload(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && /iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function backup(){ shareOrDownload(new Blob([JSON.stringify(DB)],{type:'application/json'}), `DentaLog-backup-${today()}.json`); }
$('#jsonFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d = JSON.parse(await f.text()); if(!Array.isArray(d.visits)) throw new Error('Not a DentaLog backup');
    const nd = normalizeDB(d);
    if(DB.visits.length && !confirm(`Merge the backup (${nd.visits.length} visits) into this device? Newer changes win.`)) return;
    DB = Sync.merge(DB, nd); const n = foldDuplicates(); save(); render(); toast('Backup restored'+(n?` · ${n} duplicates combined`:''));
  }catch(err){ alert('Could not restore: '+err.message); }
};
// two copies of the same appointment (e.g. imported on the phone AND restored from a backup):
// keep one, fill its empty fields from the other
function foldDuplicates(){
  let n = 0; const byDay = new Map();
  DB.visits.forEach(v=>{ const k = v.clinic+'|'+v.date; if(!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(v); });
  const drop = new Set();
  for(const list of byDay.values()) for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a = list[i], b = list[j]; if(drop.has(a.id) || drop.has(b.id)) continue;
    const same = (a.nhc && b.nhc ? a.nhc===b.nhc : nameScore(a.patient,b.patient)>=0.8) && (!a.time || !b.time || a.time===b.time);
    if(!same) continue;
    const keep = (a.upd||0) >= (b.upd||0) ? a : b, other = keep===a ? b : a;
    ['time','nhc','mutua','phone','obs','notes','paid','ins','origPatient'].forEach(k=>{ if(blank(keep[k]) && !blank(other[k])) keep[k] = other[k]; });
    if(!(keep.lines||[]).length && (other.lines||[]).length) keep.lines = other.lines;
    if(keep.status==='pending' && other.status!=='pending') keep.status = other.status;
    drop.add(other.id); n++;
  }
  DB.visits = DB.visits.filter(v=>!drop.has(v.id));
  return n;
}
async function exportExcel(){
  try{
    await loadScript(XLSXJS);
    const rows = DB.visits.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')).map(v=>({
      Date: fromIso(v.date), Clinic: clinicById(v.clinic).name, Time: v.time||'', NHC: v.nhc||'', Patient: v.patient, Mutua: v.mutua||'', Status: STATUS[v.status],
      'Observación': v.obs||'', Cash: blank(v.paid)?'':num(v.paid), Insurance: blank(v.ins)?'':num(v.ins), Total: visitTotal(v), Check: v.check||'',
      'Clinic factura': (v.lines||[]).length ? r2(billedTotal(v)) : '', 'Factura lines': (v.lines||[]).map(l=>l.desc+' '+decStr(l.amt)).join(' | '), Comment: v.notes||'', 'Gesden note': v.obsOrig||''}));
    const ws = XLSX.utils.json_to_sheet(rows, {cellDates:true, dateNF:'dd/mm/yyyy'});
    const sumRows = [];
    DB.clinics.forEach(c=>{ const months = [...new Set([...Object.keys(DB.liq).filter(k=>k.startsWith(c.id+'|')).map(k=>k.split('|')[1]), ...DB.visits.filter(v=>v.clinic===c.id).map(v=>v.date.slice(0,7))])].sort();
      months.forEach(m=>{ const H=herCalc(m,c.id), L=DB.liq[lkey(c.id,m)]; sumRows.push({Clinic:c.name, Month:m, Patients: monthVisits(m,c.id).filter(attended).length, 'Her produced':r2(H.prod), 'Her liquidation':r2(H.liquidation), 'Clinic produced': L? r2(L.totalProduced ?? sum(L.lines,l=>l.amt)) : null, 'Clinic liquidation': L?.liquidation ?? null, Difference: L?.liquidation!=null ? r2(L.liquidation-H.liquidation) : null, 'To receive': L?.factura?.net ?? null}); }); });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Visits'); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sumRows), 'Months');
    shareOrDownload(new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `DentaLog-${today()}.xlsx`);
  }catch(err){ alert(err.message); }
}
/* Her Excel ("Sofias Diario de Trabajo"): one sheet per clinic, one row per appointment:
   DIA | Hora | NHC | PACIENTE | MUTUA | OBSERVACIONES | PAGADO | MUTUA (€) | TOTAL | Neto */
$('#xlsFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    await loadScript(XLSXJS);
    const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
    const sheets = [];
    for(const sn of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:''});
      for(let h=0; h<Math.min(15, rows.length); h++){ const map = mapHeaders(rows[h]); if(map.date!=null && map.patient!=null && (map.price!=null || map.paid!=null || map.treatment!=null)){ sheets.push({sn, rows, h, map}); break; } }
    }
    if(!sheets.length) throw new Error('No sheet with Date and Patient columns (e.g. "DIA", "PACIENTE").');
    openExcelPreview(sheets, f.name);
  }catch(err){ alert('Excel import failed: '+err.message); console.error(err); }
};
function excelVisits(sheet, clinic){
  const {rows,h,map} = sheet; const byKey = new Map();
  for(let i=h+1;i<rows.length;i++){
    const r = rows[i]; const d = toIsoDate(r[map.date]); const raw = String(r[map.patient]||'').trim();
    if(!d || !raw) continue;
    const {name, flags} = cleanName(raw);
    const k = d+'|'+norm(name); let v = byKey.get(k);
    const obs = map.obs!=null ? String(r[map.obs]||'').replace(/\s*No\s*Confirmada\s*$/i,'').trim() : '';
    if(!v){
      const noShow = /no vin|no ha venido|no viene|anulad|cancelad|falta\b/i.test(obs);
      v = {id:uid(), clinic, date:d, time:fmtTime(map.time!=null?r[map.time]:''), nhc:map.nhc!=null?String(r[map.nhc]||'').replace(/\D/g,''):'', patient:name, origPatient:name, flags,
        mutua:map.mutua!=null?String(r[map.mutua]||'').trim():'', obs, status:noShow?'noshow':'attended', paid:'', ins:'', insAuto:false, lines:[], notes:'', source:'excel'};
      byKey.set(k,v);
    }
    const paid = map.paid!=null ? parseMoney(r[map.paid]) : 0, mut = map.mutuaAmt!=null ? parseMoney(r[map.mutuaAmt]) : 0, total = map.price!=null ? parseMoney(r[map.price]) : 0;
    const t = map.treatment!=null ? String(r[map.treatment]||'').trim() : ''; if(t && !norm(v.obs).includes(norm(t))) v.obs = v.obs ? v.obs+', '+t : t;
    if(paid) v.paid = r2(num(v.paid)+paid);
    if(mut) v.ins = r2(num(v.ins)+mut);
    if(!paid && !mut && total && map.paid==null) v.paid = r2(num(v.paid)+total);
  }
  return [...byKey.values()];
}
function openExcelPreview(sheets, fname){
  const st = sheets.map(s=>{ const c = detectClinic(s.sn, 'name') || detectClinic(s.sn, 'agenda'); return {...s, use:true, clinic:(c || DB.clinics[0]).id, detected:!!c}; });
  const ov = sheet(''); const box = ov.querySelector('.sheet');
  const dupOf = (v, clinic) => DB.visits.some(x=>x.clinic===clinic && x.date===v.date && nameScore(x.patient,v.patient)>=0.8);
  const draw = () => {
    box.innerHTML = `<div class="grab"></div><h2>Import ${esc(fname)}</h2>
      <div class="small muted">Each sheet becomes one clinic's visits. PAGADO → paid at clinic, the MUTUA amount → insurance.</div>
      ${st.map((s,i)=>{ const vs = excelVisits(s, s.clinic); const months=[...new Set(vs.map(v=>v.date.slice(0,7)))].sort(); const dup = vs.filter(v=>dupOf(v,s.clinic)).length;
        return `<div class="glass card" style="margin-top:10px"><label class="chk" style="margin:0"><input type="checkbox" data-use="${i}" ${s.use?'checked':''}> <b>Sheet "${esc(s.sn)}"</b></label>
        <div class="small muted" style="margin:6px 0">${vs.length} visits · ${months.length?monthLabel(months[0])+' – '+monthLabel(months[months.length-1]):''} · ${eur(sum(vs,visitTotal))}${dup?` · <b style="color:var(--warn)">${dup} already here (skipped)</b>`:''}</div>
        <div class="row"><span class="small muted">Clinic</span>${clinicSelectHtml('xc'+i, s.clinic, {style:'width:auto'})}</div></div>`; }).join('')}
      <div class="row" style="margin-top:14px"><div class="grow"></div><button class="btn" data-x>Cancel</button><button class="btn pri" id="xGo">Import</button></div>`;
    st.forEach((s,i)=>{ box.querySelector('#xc'+i).onchange = e => { s.clinic = e.target.value; draw(); }; box.querySelector(`[data-use="${i}"]`).onchange = e => { s.use = e.target.checked; }; });
    box.querySelector('#xGo').onclick = () => { let n=0; st.filter(s=>s.use).forEach(s=>excelVisits(s, s.clinic).forEach(v=>{ if(dupOf(v, s.clinic)) return; DB.visits.push(v); n++; }));
      Object.keys(DB.liq).forEach(k=>{ const [cid, ym] = k.split('|'); applyLiq(cid, ym); });
      save(); ov.remove(); render(); toast(`Imported ${n} visits`); };
  };
  draw();
}
function mapHeaders(hdr){
  const K = { date:/^(fecha|date|dia|día|day)\b/, time:/^(hora|time)$/, nhc:/^(nhc|historia)/, patient:/(paciente|patient|nombre|name)/, treatment:/(tratamiento|treatment|trat|procedimiento|descrip|servicio)/,
    obs:/^(observ|obs\b)/, paid:/(pagad|paid|cobrad|abonad)/, mutua:/(mutua|seguro|aseguradora|insur)/, price:/^(total|precio|price|importe|honorario|producido|coste|cost)/ };
  const m={};
  (hdr||[]).forEach((c,i)=>{ const n=norm(c); if(!n) return;
    if(/^mutua$/.test(n) && m.mutua!=null && m.mutuaAmt==null){ m.mutuaAmt=i; return; }
    for(const [k,rx] of Object.entries(K)){ if(m[k]==null && rx.test(n)){ m[k]=i; break; } } });
  return m;
}
function fmtTime(v){
  if(v instanceof Date && !isNaN(v)) return pad(v.getHours())+':'+pad(v.getMinutes());
  if(typeof v==='number' && v>0 && v<1){ const mins = Math.round(v*1440); return pad(Math.floor(mins/60))+':'+pad(mins%60); }
  const m = String(v||'').match(/(\d{1,2})[:.](\d{2})/); return m ? pad(m[1])+':'+m[2] : '';
}
function toIsoDate(v){
  if(v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number' && v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*86400e3)); return iso(new Date(d.getTime()+d.getTimezoneOffset()*60e3)); }
  const s=String(v||''); let m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
